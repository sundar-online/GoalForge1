# ─────────────────────────────────────────────────────────────────
#  GoalForge – Netlify Build Configuration
#  Flutter 3.44.7 · Dart 3.12.2 · Firebase Web
# ─────────────────────────────────────────────────────────────────

[build]
  base    = "."
  command = "git clone https://github.com/flutter/flutter.git --depth 1 --branch 3.44.7 /opt/flutter && export PATH=\"$PATH:/opt/flutter/bin\" && flutter config --no-analytics && flutter config --enable-web && flutter precache --web && flutter pub get && flutter build web --release --base-href / --no-tree-shake-icons"
  publish = "build/web"

[build.environment]
  NODE_VERSION  = "18"
  PUB_CACHE     = "/opt/cache/pub-cache"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
  force  = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-XSS-Protection       = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://apis.google.com https://accounts.google.com https://www.gstatic.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.cloudfunctions.net wss://*.firebaseio.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-src https://accounts.google.com https://*.firebaseapp.com;"

[[headers]]
  for = "/flutter_service_worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/main.dart.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"