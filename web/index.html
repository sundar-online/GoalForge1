<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    The base href is replaced at build time by flutter build web --base-href /.
    Do NOT hardcode a path here; let the Flutter build toolchain set it.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <!--
    google_sign_in_web requires this meta tag to initialise the Google Identity
    Services library. Replace the content value with your actual OAuth 2.0
    client ID from the Firebase Console → Project Settings → Web app.
  -->
  <meta name="google-signin-client_id" content="328180873593-e642ee566084375feed7a8.apps.googleusercontent.com">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GoalForge – Build powerful habits and achieve your goals with real-time tracking and intelligent insights.">

  <!-- Open Graph / Social sharing -->
  <meta property="og:type"        content="website">
  <meta property="og:title"       content="GoalForge">
  <meta property="og:description" content="Build powerful habits and achieve your goals with real-time tracking and intelligent insights.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GoalForge">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GoalForge</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    The flutter_bootstrap.js script initialises the Flutter engine.
    It is generated by `flutter build web` and must not be removed.
    See: https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
